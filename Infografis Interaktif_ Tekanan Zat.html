<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infografis Interaktif: Tekanan Zat</title>
<style>
:root{--bg:#f6f8fb;--ink:#17212b;--mut:#5b6773;--card:#fff;--line:#d9e0e8;--acc:#1d6fb8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--ink:#eaf0f6;--mut:#9aa8b6;--card:#1b232c;--line:#2c3743;--acc:#6db3f2}}
:root[data-theme="dark"]{--bg:#12171d;--ink:#eaf0f6;--mut:#9aa8b6;--card:#1b232c;--line:#2c3743;--acc:#6db3f2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,sans-serif;line-height:1.5}
header{max-width:1280px;margin:0 auto;padding:18px 16px 8px}
h1{font-size:clamp(1.3rem,3vw,1.9rem);margin:0 0 2px;font-weight:800}
header p{margin:0;color:var(--mut);font-size:.95rem}
.wrap{max-width:1280px;margin:0 auto;padding:8px 16px 28px}
.stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff}
.stage img{display:block;width:100%;height:auto}
.hs{position:absolute;border:2px solid transparent;border-radius:14px;background:transparent;cursor:pointer;padding:0;transition:background .15s,border-color .15s}
.hs:hover,.hs:focus-visible{background:rgba(29,111,184,.14);border-color:var(--c,#1d6fb8);outline:none}
.hs .tag{position:absolute;right:6px;bottom:6px;background:var(--c,#1d6fb8);color:#fff;font:700 clamp(9px,1vw,13px)/1 "Nunito",sans-serif;padding:4px 8px;border-radius:99px;opacity:0;transition:opacity .15s}
.hs:hover .tag,.hs:focus-visible .tag{opacity:1}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.nav button{border:2px solid var(--c);background:var(--card);color:var(--ink);font:700 .9rem "Nunito",sans-serif;padding:8px 14px;border-radius:99px;cursor:pointer}
.nav button:hover,.nav button:focus-visible{background:var(--c);color:#111;outline:none}
.hint{color:var(--mut);font-size:.88rem;margin:10px 0 0}
.ov{position:fixed;inset:0;background:rgba(10,16,22,.6);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.ov.on{display:flex}
.pn{background:var(--card);color:var(--ink);width:min(780px,100%);max-height:88vh;overflow:auto;border-radius:16px;border-top:8px solid var(--c);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px 4px;position:sticky;top:0;background:var(--card)}
.ph h2{margin:0;font-size:1.3rem}
.x{border:1px solid var(--line);background:transparent;color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:1.2rem;cursor:pointer;flex:none}
.pb{padding:4px 20px 20px}
.pb h3{margin:16px 0 4px;font-size:1.02rem;color:var(--ink)}
.pb p,.pb li{font-size:.96rem;margin:4px 0}
.pb ul{padding-left:20px;margin:4px 0}
.f{background:var(--bg);border-left:4px solid var(--c);padding:8px 12px;border-radius:6px;font-weight:700;margin:8px 0;font-size:1rem}
.ex{background:var(--bg);border:1px dashed var(--c);border-radius:10px;padding:10px 14px;margin:10px 0}
.ex b.t{display:block;margin-bottom:2px}
table{border-collapse:collapse;width:100%;font-size:.92rem;margin:8px 0}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--bg)}
.sc{overflow-x:auto}
.pf{display:flex;gap:8px;justify-content:space-between;padding:0 20px 18px}
.pf button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer;font:600 .85rem "Nunito",sans-serif}
</style>
</head>

var W=2576,H=1438;
var S={
konsep:{t:"Konsep Dasar Tekanan",c:"#5bb8e8",h:"<p>Tekanan adalah gaya yang bekerja tegak lurus pada setiap satuan luas bidang tekan.</p><div class='f'>P = F / A</div><div class='sc'><table><tr><th>Besaran</th><th>Satuan SI</th></tr><tr><td>P = tekanan</td><td>Pa (N/m²)</td></tr><tr><td>F = gaya</td><td>N</td></tr><tr><td>A = luas bidang tekan</td><td>m²</td></tr></table></div><h3>Hubungan gaya dan luas</h3><ul><li>F makin besar, P makin besar (berbanding lurus)</li><li>A makin kecil, P makin besar (berbanding terbalik)</li></ul><h3>Konversi penting</h3><ul><li>1 cm² = 10⁻⁴ m²</li><li>1 atm = 76 cmHg = 101.325 Pa ≈ 10⁵ Pa</li></ul>"},
padat:{t:"Tekanan Zat Padat",c:"#f2c744",h:"<div class='f'>P = F / A, dengan F = w = m × g (g = 10 m/s²)</div><h3>Penerapan</h3><ul><li><b>Luas kecil, tekanan besar:</b> pisau, paku, jarum, kapak, ujung pensil</li><li><b>Luas besar, tekanan kecil:</b> sepatu salju, roda traktor, fondasi bangunan, ban truk lebar</li></ul><div class='ex'><b class='t'>Contoh Soal 1</b>Balok bermassa 20 kg, alas 0,5 m × 0,4 m. Berapa tekanannya pada lantai?<br>F = 20 × 10 = 200 N; A = 0,5 × 0,4 = 0,2 m²<br>P = 200 / 0,2 = <b>1.000 Pa</b></div><div class='ex'><b class='t'>Contoh Soal 2</b>Paku ditekan dengan gaya 20 N. Luas ujung 5 × 10⁻⁷ m², luas kepala 10⁻⁴ m². Bandingkan tekanannya.<br>Ujung: 20 / (5 × 10⁻⁷) = <b>4 × 10⁷ Pa</b><br>Kepala: 20 / 10⁻⁴ = <b>2 × 10⁵ Pa</b><br>Tekanan di ujung 200 kali lebih besar, sehingga paku menembus kayu.</div>"},
hidro:{t:"Tekanan Hidrostatis",c:"#52b788",h:"<div class='f'>P = ρ × g × h</div><p>ρ = massa jenis (kg/m³), g = 10 m/s², h = kedalaman dari permukaan (m).</p><h3>Sifat</h3><ul><li>Makin dalam, makin besar tekanannya</li><li>Sama besar pada kedalaman yang sama</li><li>Bekerja ke segala arah</li><li>Tidak bergantung pada bentuk wadah</li></ul><h3>Penerapan</h3><p>Dinding bendungan bawah lebih tebal, batas kedalaman penyelam, menara air dibuat tinggi.</p><div class='ex'><b class='t'>Contoh Soal 3</b>Penyelam di kedalaman 20 m laut (ρ = 1.000 kg/m³). Berapa tekanan hidrostatisnya?<br>P = 1.000 × 10 × 20 = <b>200.000 Pa</b></div>"},
pascal:{t:"Hukum Pascal",c:"#52b788",h:"<p>Tekanan yang diberikan pada zat cair dalam ruang tertutup diteruskan sama besar ke segala arah.</p><div class='f'>P₁ = P₂ → F₁/A₁ = F₂/A₂</div><h3>Penerapan</h3><ul><li>Dongkrak hidrolik</li><li>Rem hidrolik</li><li>Pompa hidrolik</li><li>Bendungan (tekanan bawah lebih besar)</li></ul><div class='ex'><b class='t'>Contoh Soal 4</b>Dongkrak hidrolik: penampang kecil 10 cm², penampang besar 500 cm². Gaya 100 N pada penampang kecil. Berapa gaya pada penampang besar?<br>F₂ = 100 × (500 / 10) = <b>5.000 N</b><br>Keuntungan mekanis = 500 / 10 = 50 kali</div>"},
archi:{t:"Hukum Archimedes",c:"#52b788",h:"<p>Benda yang dicelupkan ke dalam zat cair mendapat gaya ke atas sebesar berat zat cair yang dipindahkan.</p><div class='f'>Fₐ = ρ cair × g × V tercelup</div><p>Atau Fₐ = w di udara − w di dalam cairan.</p><div class='sc'><table><tr><th>Kondisi</th><th>Syarat</th></tr><tr><td>Terapung</td><td>ρ benda &lt; ρ cair</td></tr><tr><td>Melayang</td><td>ρ benda = ρ cair</td></tr><tr><td>Tenggelam</td><td>ρ benda &gt; ρ cair</td></tr></table></div><h3>Penerapan</h3><p>Kapal laut, kapal selam (tangki ballast), balon udara, hidrometer, jembatan ponton.</p><div class='ex'><b class='t'>Contoh Soal 5</b>Benda bervolume 0,002 m³ tercelup seluruhnya di air (ρ = 1.000 kg/m³).<br>Fₐ = 1.000 × 10 × 0,002 = <b>20 N</b></div><div class='ex'><b class='t'>Contoh Soal 6</b>Batu di udara 30 N, di dalam air 20 N.<br>Fₐ = 30 − 20 = <b>10 N</b></div>"},
udara:{t:"Tekanan Udara dan Alat Ukur",c:"#f4a261",h:"<div class='f'>1 atm = 76 cmHg = 101.325 Pa</div><ul><li>Makin tinggi tempat, makin rendah tekanan udara</li><li>Setiap naik 100 m, tekanan turun ± 1 cmHg</li></ul><h3>Alat ukur</h3><ul><li><b>Barometer:</b> mengukur tekanan udara</li><li><b>Manometer:</b> mengukur tekanan gas dalam ruang tertutup</li></ul><div class='ex'><b class='t'>Contoh Soal 7</b>Tekanan di permukaan laut 76 cmHg. Berapa tekanan di puncak gunung 2.000 m?<br>Penurunan = 2.000 / 100 = 20 cmHg<br>P = 76 − 20 = <b>56 cmHg</b></div><div class='ex'><b class='t'>Contoh Soal 8</b>Manometer pipa U terbuka. Tekanan udara luar 76 cmHg, raksa di sisi gas lebih rendah 10 cm dari sisi terbuka.<br>P gas = 76 + 10 = <b>86 cmHg</b></div>"},
boyle:{t:"Hukum Boyle dan Penerapan Gas",c:"#f4a261",h:"<p>Pada suhu tetap, tekanan gas berbanding terbalik dengan volumenya.</p><div class='f'>P × V = tetap → P₁V₁ = P₂V₂</div><h3>Penerapan</h3><p>Pompa sepeda, semprotan nyamuk, penyedot/sedotan, ban kendaraan, tabung gas, suntikan.</p><div class='ex'><b class='t'>Contoh Soal 9</b>Gas dalam tabung 6 L bertekanan 1 atm ditekan hingga volumenya 2 L (suhu tetap).<br>P₂ = (1 × 6) / 2 = <b>3 atm</b></div>"},
tumbuhan:{t:"Tekanan pada Tumbuhan",c:"#b48be0",h:"<div class='sc'><table><tr><th>Konsep</th><th>Penjelasan</th></tr><tr><td><b>Tekanan akar (osmosis)</b></td><td>Air dari tanah masuk ke sel akar dan mendorong air naik ke batang</td></tr><tr><td><b>Daya kapilaritas</b></td><td>Air naik lewat pembuluh xilem yang sempit karena gaya adhesi dan kohesi</td></tr><tr><td><b>Transpirasi</b></td><td>Penguapan di daun menimbulkan daya hisap yang menarik air dari akar</td></tr><tr><td><b>Tekanan turgor</b></td><td>Sel penuh air menekan dinding sel, batang dan daun tegak dan kokoh</td></tr><tr><td><b>Layu</b></td><td>Air kurang, turgor turun, tumbuhan layu</td></tr><tr><td><b>Stomata</b></td><td>Sel penjaga menggembung, stomata membuka; mengendur, stomata menutup</td></tr></table></div><p><b>Alur air:</b> akar → xilem → batang → daun → menguap (transpirasi)</p>"},
hidup:{t:"Tekanan pada Makhluk Hidup",c:"#f08a7a",h:"<h3>Manusia</h3><div class='sc'><table><tr><td><b>Tekanan darah</b></td><td>Normal ± 120/80 mmHg (sistolik/diastolik), diukur dengan tensimeter</td></tr><tr><td><b>Pernapasan</b></td><td>Diafragma turun, volume paru membesar, tekanan paru turun, udara masuk (Hukum Boyle)</td></tr><tr><td><b>Telinga</b></td><td>Tuba eustachius menyamakan tekanan telinga tengah dan luar</td></tr><tr><td><b>Mengisap sedotan</b></td><td>Tekanan dalam sedotan turun, tekanan udara luar mendorong cairan naik</td></tr></table></div><h3>Hewan</h3><div class='sc'><table><tr><td><b>Unta</b></td><td>Telapak kaki lebar (A besar, P kecil), tidak tenggelam di pasir</td></tr><tr><td><b>Burung hantu, elang, kucing</b></td><td>Cakar tajam (A kecil, P besar), mudah mencengkeram</td></tr><tr><td><b>Ikan</b></td><td>Gelembung renang mengatur naik dan turun (Archimedes)</td></tr><tr><td><b>Ikan laut dalam</b></td><td>Tubuh beradaptasi dengan tekanan hidrostatis tinggi</td></tr><tr><td><b>Cicak</b></td><td>Telapak kaki bertekanan rendah, tekanan udara luar membuatnya menempel</td></tr></table></div><div class='ex'><b class='t'>Contoh Soal 10 (unta vs kuda)</b>Berat sama 4.000 N. Luas telapak unta 0,2 m², luas kuku kuda 0,02 m².<br>Unta: 4.000 / 0,2 = <b>20.000 Pa</b>; Kuda: 4.000 / 0,02 = <b>200.000 Pa</b><br>Tekanan kuda 10 kali lebih besar, sehingga lebih mudah terbenam.</div><div class='ex'><b class='t'>Contoh Soal 11 (ikan laut dalam)</b>Kedalaman 100 m, ρ = 1.000 kg/m³.<br>P = 1.000 × 10 × 100 = <b>1.000.000 Pa</b> (± 10 atm)</div>"},
rumus:{t:"Ringkasan Rumus",c:"#4a9fd8",h:"<div class='sc'><table><tr><th>Zat</th><th>Konsep</th><th>Rumus</th></tr><tr><td>Padat</td><td>Tekanan</td><td>P = F/A</td></tr><tr><td>Cair</td><td>Hidrostatis</td><td>P = ρ g h</td></tr><tr><td>Cair</td><td>Hukum Pascal</td><td>F₁/A₁ = F₂/A₂</td></tr><tr><td>Cair</td><td>Hukum Archimedes</td><td>Fₐ = ρ g V</td></tr><tr><td>Gas</td><td>Hukum Boyle</td><td>P₁V₁ = P₂V₂</td></tr><tr><td>Gas</td><td>Tekanan atmosfer</td><td>turun 1 cmHg tiap naik 100 m</td></tr></table></div>"}
};
